name: pluto-takeaway

services:
    mysql:
        image: mysql:8.4
        ports:
            - "127.0.0.1:3307:3306"
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: pluto_takeaway
            MYSQL_USER: pluto
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        volumes:
            - mysql_data:/var/lib/mysql
        
volumes:
    mysql_data: